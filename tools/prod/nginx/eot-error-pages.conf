# Branded pages for errors nginx itself produces (Odoo down/restarting, upload
# too big, rate limit). Include inside the eot.ir server blocks:
#     include snippets/eot-error-pages.conf;
# Files live outside /opt/odoo (root:odoo 750, unreadable for nginx):
#     install -d /var/www/eot-errors && install -m 644 static/errors/[0-9]*.html /var/www/eot-errors/
# Odoo-origin errors (400/403/404/500...) are rendered by the theme, not here.
error_page 413 /eot-err-413.html;
error_page 429 /eot-err-429.html;
error_page 502 /eot-err-502.html;
error_page 503 /eot-err-503.html;
error_page 504 /eot-err-504.html;
location ~ ^/eot-err-(413|429|502|503|504)\.html$ {
    root /var/www/eot-errors;
    rewrite ^/eot-err-(.*)$ /$1 break;
    internal;
    add_header Cache-Control "no-store" always;
}
