# Branded page while odoo20 restarts (deploys). Include inside the eot.ir
# server blocks:   include snippets/eot-error-pages.conf;
# The page lives outside /opt/odoo (root:odoo 750, unreadable for nginx):
#   install -D -m 644 static/errors/502.html /var/www/eot-errors/502.html
error_page 502 503 504 /eot-502.html;
location = /eot-502.html {
    root /var/www/eot-errors;
    try_files /502.html =502;
    internal;
    add_header Cache-Control "no-store" always;
}
